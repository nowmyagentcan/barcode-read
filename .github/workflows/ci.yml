name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  MACOSX_DEPLOYMENT_TARGET: '13.3'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --locked
      - name: A double-clicked exe opens the page (opens the runner's browser)
        if: runner.os == 'Windows'
        run: cargo test --locked --test ui -- --ignored --exact a_double_click_starts_the_page
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses
      - name: The wrapper matches the pinned upstream commit plus the patch
        run: scripts/vendor-zxing.sh && git diff --exit-code vendor/zxing-cpp-rs
