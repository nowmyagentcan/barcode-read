# cargo about generate --locked -c scripts/about.toml scripts/about.hbs -o THIRD-PARTY-LICENSES.txt
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "BSL-1.0", "0BSD", "MIT-0", "CC0-1.0", "Unlicense", "Apache-2.0 WITH LLVM-exception"]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
private = { ignore = true }
workarounds = ["chrono"]

# The wrapper crate is Apache-2.0; the BSD-3-Clause and MIT parts it compiles from C sources
# are credited with their real copyright lines at the end of about.hbs.
[zxing-cpp.clarify]
license = "Apache-2.0"
files = [{ path = "LICENSE", checksum = "c6596eb7be8581c18be736c846fb9173b69eccf6ef94c5135893ec56bd92ba08" }]

# The windows crates indent their licence text, so it isn't recognised without help.
[windows-sys.clarify]
license = "MIT"
files = [{ path = "license-mit", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]

[windows-link.clarify]
license = "MIT"
files = [{ path = "license-mit", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]
