<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Read QR codes and barcodes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' rx='57' fill='%237c3aed'/><path transform='translate(48 48) scale(.625)' fill='%23fff' d='M100,36H56A20,20,0,0,0,36,56v44a20,20,0,0,0,20,20h44a20,20,0,0,0,20-20V56A20,20,0,0,0,100,36ZM96,96H60V60H96Zm4,40H56a20,20,0,0,0-20,20v44a20,20,0,0,0,20,20h44a20,20,0,0,0,20-20V156A20,20,0,0,0,100,136Zm-4,60H60V160H96ZM200,36H156a20,20,0,0,0-20,20v44a20,20,0,0,0,20,20h44a20,20,0,0,0,20-20V56A20,20,0,0,0,200,36Zm-4,60H160V60h36Zm-60,76V148a12,12,0,0,1,24,0v24a12,12,0,0,1-24,0Zm84-8a12,12,0,0,1-12,12H196v32a12,12,0,0,1-12,12H148a12,12,0,0,1,0-24h24V148a12,12,0,0,1,24,0v4h12A12,12,0,0,1,220,164Z'/></svg>">
<style>
:root { --bg:#fafaf9; --fg:#1c1b1a; --muted:#6b6966; --line:#e7e5e2; --field:#f2f1ef; --accent:#0f7b4a; --danger:#b42318; --r:8px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#121110; --fg:#ecebe9; --muted:#9a9894; --line:#2a2826; --field:#1b1a19; --accent:#5fd38d; --danger:#f97066; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 28px 16px 20px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 19px; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
p, h2, pre { margin: 0; }
svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.visual { width: auto; height: 64px; justify-self: center; color: var(--muted); }
form { display: grid; gap: 12px; }
#zone { display: grid; gap: 2px; place-content: center; min-height: 96px; padding: 16px; font: inherit; color: var(--fg); text-align: center;
  white-space: normal; background: none; border: 2px dashed var(--line); border-radius: var(--r); cursor: pointer; }
#zone:hover, #zone.over { border-color: var(--accent); background: var(--field); }
#chosen { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input { width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); }
select { width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); }
.opts { display: grid; grid-template-columns: 1.4fr 1fr 6rem; gap: 12px; margin-top: 10px; }
.check { grid-column: span 2; display: flex; align-items: center; gap: 8px; align-self: end; min-height: 40px; font-size: 15px; color: var(--fg); }
.check input { width: 18px; min-height: 18px; accent-color: var(--accent); }
summary { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; list-style: none; border-radius: var(--r); }
summary::-webkit-details-marker { display: none; }
details[open] summary svg { transform: rotate(90deg); }
button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; font: inherit; font-size: 14px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; white-space: nowrap; }
button:active { transform: translateY(1px); }
.go { justify-self: center; min-height: 40px; padding: 8px 40px; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--accent); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#out { display: grid; gap: 16px; min-height: 88px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); align-content: start; }
.muted { color: var(--muted); }
.bar { width: 100%; height: 3px; overflow: hidden; border-radius: var(--r); }
.bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s linear infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar::after { width: 100%; animation: none; } }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
.sum { font-size: 17px; font-weight: 600; }
.acts { display: flex; gap: 8px; }
.file { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
h2 { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
h2 span { font-weight: 400; color: var(--muted); }
.code { display: grid; gap: 6px; }
.meta { font-size: 13px; color: var(--muted); }
pre { padding: 10px 12px; max-height: 240px; overflow: auto; font: 14px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--field); border-radius: var(--r); }
.warn, .err { display: flex; gap: 8px; align-items: baseline; }
.warn svg, .err svg { position: relative; top: 3px; }
.err { color: var(--danger); font-weight: 600; }
.hint { padding-left: 24px; }
footer { display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 13px; }
footer a { display: inline-flex; color: var(--muted); border-radius: 4px; }
footer a:hover { color: var(--fg); }
footer svg { width: 18px; height: 18px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } .check { grid-column: auto; } }
</style>

    <path transform="translate(112 16) scale(.125)" d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/>
    <rect x="159" y="15" width="108" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="213" y="37" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="15">ABC-123</text>

  <form>
    <button type="button" id="zone" aria-describedby="chosen">
      <span>Drop images or PDFs here, click to choose, or paste a screenshot (<span id="key">Ctrl</span>+V)</span>

    <input type="file" id="files" multiple hidden accept=".png,.jpg,.jpeg,.jpe,.jfif,.gif,.bmp,.webp,.tif,.tiff,.pbm,.pgm,.ppm,.pnm,.pdf">

<script>
const $ = s => document.querySelector(s);
const form = $("form"), zone = $("#zone"), input = $("#files"), out = $("#out");
const icon = d => `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${d}"/></svg>`;
const COPY = icon("M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z");
const SAVE = icon("M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z");
const WARN = icon("M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z");
const FAIL = icon("M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z");
if (/Mac|iPhone|iPad/.test(navigator.userAgent)) $("#key").textContent = "Cmd";

// Sample answers in the shape of the server's files[0] object, until the page talks to it.
async function read(file) {
  await new Promise(r => setTimeout(r, 400));
  const f = { path: file.name, type: "png", pages: [{ page: 1, width: 640, height: 480 }], barcodes: [], warnings: [], error: null };
  const qr = { page: 1, format: "QR Code", text: "https://example.com/t/42", content: "text", bytes_base64: null, symbology_id: "]Q1",
    position: [[467, 1046], [729, 1046], [729, 1309], [467, 1308]], rotation: 0, ec_level: "M", version: "1", sequence: null };
  if (/\.hei[cf]$/i.test(file.name)) return { ...f, type: null, pages: [], error: { code: "unsupported_format",
    message: "HEIC/HEIF photos aren't supported yet.", hint: "Export it as JPEG first (iPhone: Settings > Camera > Formats > Most Compatible)." } };
  if (/blank/i.test(file.name)) return { ...f, warnings: [{ code: "none_found", message: "No barcode found. Try a sharper, closer photo with the whole code in view." }] };
  if (/\.pdf$/i.test(file.name)) return { ...f, type: "pdf", pages: [{ page: 1, width: 2479, height: 3508, dpi: 300 }, { page: 2, width: 2479, height: 3508, dpi: 300 }],
    barcodes: [qr, { ...qr, format: "Code 128", text: "(01)09501101530003(10)LOT7", content: "gs1", bytes_base64: "MDEwOTUwMTEwMTUzMDAwMzEwTE9UNw==",
      symbology_id: "]C1", position: [[40, 1500], [839, 1500], [839, 1699], [40, 1699]], ec_level: null, version: null }],
    warnings: [{ code: "page_failed", message: "Page 2 couldn't be read: unsupported shading type." }] };
  return { ...f, barcodes: [qr] };
}

// Payload text is untrusted: it only ever reaches the page through textContent. Controls and bidi marks are shown by name.
const C0 = "NUL SOH STX ETX EOT ENQ ACK BEL BS HT LF VT FF CR SO SI DLE DC1 DC2 DC3 DC4 NAK SYN ETB CAN EM SUB ESC FS GS RS US".split(" ");
const shown = s => s.replace(/[\0-\x08\x0b-\x1f\x7f-\x9f؜‎‏‪-‮⁦-⁩]/g, c =>
  c < " " ? `<${C0[c.charCodeAt(0)]}>` : c === "\x7f" ? "<DEL>" : `<U+${c.charCodeAt(0).toString(16).toUpperCase().padStart(4, "0")}>`);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const button = (svg, label, act, value) => { const b = el("button"); b.type = "button"; b.innerHTML = svg; b.append(label); b.dataset.act = act; if (value != null) b.dataset.value = value; return b; };
const paged = f => f.type === "pdf" || f.type === "tiff";
const tag = c => c.content === "text" ? "" : c.content === "gs1" ? "GS1" : `${c.content.replace("_", " ")}, ${atob(c.bytes_base64).length} bytes`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const name = p => p.split(/[\\/]/).pop();

function line(f, c) { return [name(f.path), paged(f) ? `page ${c.page}` : "", c.format, tag(c)].filter(Boolean).join("  "); }

function asText(files) {
  const lines = [];
  for (const f of files) {
    for (const c of f.barcodes) lines.push(line(f, c), ...c.text.split("\n").map(t => "  " + shown(t)));
    if (f.error) lines.push(`✗ ${name(f.path)}: ${f.error.message}`, ...(f.error.hint ? ["  " + f.error.hint] : []));
    for (const w of f.warnings) w.code === "none_found"
      ? lines.push(`${name(f.path)}  no barcode found`, ...(w.message.slice(18) ? ["  " + w.message.slice(18)] : []))
      : lines.push(`! ${name(f.path)}: ${w.message}`);
  }
  if (files.length > 1) lines.push(summary(files));
  return lines.join("\n") + "\n";
}

function summary(files) {
  const found = files.reduce((n, f) => n + f.barcodes.length, 0), failed = files.filter(f => f.error).length;
  if (files.length === 1) return failed ? "Couldn't read this file" : found ? `${plural(found, "code")} found` : "No code found";
  return `${plural(found, "code")} in ${files.filter(f => f.barcodes.length).length} of ${files.length} files` + (failed ? ` · ${failed} failed` : "");
}

// A spreadsheet runs a cell that starts with = + - @ tab or CR as a formula, so those get a leading quote.
const cell = v => `"${String(v).replace(/^[=+\-@\t\r]/, "'$&").replace(/"/g, '""')}"`;
const csv = files => "﻿" + [["file", "page", "format", "content", "text"], ...files.flatMap(f => f.barcodes.map(c => [f.path, c.page, c.format, c.content, c.text]))]
  .map(r => r.map(cell).join(",")).join("\r\n") + "\r\n";

function failure(box, e) {
  const p = el("p", "err"); p.innerHTML = FAIL; p.append(el("span", null, e.message));
  box.append(p);
  if (e.hint) box.append(el("p", "hint", e.hint));
}

function fileBlock(f) {
  const box = el("article", "file"), h = el("h2", null, name(f.path));
  if (f.pages.length > 1) h.append(" ", el("span", null, `${f.type.toUpperCase()} · ${f.pages.length} pages`));
  box.append(h);
  for (const c of f.barcodes) {
    const code = el("div", "code"), head = el("div", "head"), acts = el("div", "acts");
    head.append(el("p", "meta", [c.format, paged(f) ? `page ${c.page}` : "", tag(c)].filter(Boolean).join(" · ")), acts);
    acts.append(button(COPY, "Copy", "copy", c.text));
    if (c.bytes_base64) acts.append(button(COPY, "Copy base64", "copy", c.bytes_base64));
    code.append(head, el("pre", null, shown(c.text)));
    box.append(code);
  }
  for (const w of f.warnings) { const p = el("p", "warn"); p.innerHTML = WARN; p.append(el("span", null, w.message)); box.append(p); }
  if (f.error) failure(box, f.error);
  return box;
}

// The page server takes uploads up to 256 MiB; the command line reads files up to 1 GiB.
const LIMIT = 256 * 2 ** 20;
const tooBig = file => ({ path: file.name, type: null, pages: [], barcodes: [], warnings: [], error: { code: "too_large",
  message: "The file is larger than 256 MiB, the page's upload limit.", hint: `Read it from a terminal instead: barcode-read "${file.name}"` } });

let chosen = [], latest = 0, pasted = 0;

function choose(files) {
  if (!files.length) return;
  chosen = [...files];
  $("#chosen").textContent = chosen.length === 1 ? chosen[0].name : `${chosen.length} files: ${chosen.slice(0, 2).map(f => f.name).join(", ")}${chosen.length > 2 ? ` and ${chosen.length - 2} more` : ""}`;
  form.requestSubmit();
}

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const run = ++latest, results = [];
  out.removeAttribute("aria-busy");
  if (!chosen.length) {
    out.replaceChildren();
    failure(out, { message: "No file chosen.", hint: "Drop an image or PDF above, click the box to choose one, or paste a screenshot." });
    return;
  }
  const opts = { formats: $("#formats").value, pages: $("#pages").value.trim(), dpi: Number($("#dpi").value) || 300, password: $("#password").value, fast: $("#fast").checked };
  for (const k in opts) if (opts[k] === "" || opts[k] === false) delete opts[k];
  const status = el("div", "head"), list = el("div");
  list.style.display = "contents";
  out.replaceChildren(status, list);
  for (const [i, file] of chosen.entries()) {
    const wait = setTimeout(() => {
      out.setAttribute("aria-busy", "true");
      status.replaceChildren(el("div", "bar"), el("p", "muted", `Reading ${i + 1} of ${chosen.length} · ${file.name}`));
      status.firstChild.setAttribute("role", "progressbar");
      status.firstChild.setAttribute("aria-label", "Reading");
    }, 150);
    let f;
    try { f = file.size > LIMIT ? tooBig(file) : await read(file, opts); }
    catch { f = { error: { message: "Can't reach barcode-read.", hint: "Start it again with: barcode-read ui" } }; }
    clearTimeout(wait);
    if (run !== latest) return;
    if (!f.barcodes) { out.removeAttribute("aria-busy"); out.replaceChildren(); failure(out, f.error); return; }
    results.push(f);
    list.append(fileBlock(f));
  }
  out.removeAttribute("aria-busy");
  const acts = el("div", "acts");
  acts.append(button(COPY, "Copy all", "copy", asText(results)));
  if (results.some(f => f.barcodes.length)) acts.append(button(SAVE, "Save", "save", csv(results)));
  status.replaceChildren(el("p", "sum", summary(results)), acts);
});

out.addEventListener("click", async ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.act === "save") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([b.dataset.value], { type: "text/csv" }));
    a.download = "barcodes.csv";
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }
  const label = b.lastChild, was = label.textContent;
  try { await navigator.clipboard.writeText(b.dataset.value); label.textContent = "Copied"; }
  catch { label.textContent = "Can't copy"; }
  setTimeout(() => { label.textContent = was; }, 1500);
});

zone.addEventListener("click", () => input.click());
input.addEventListener("change", () => { choose(input.files); input.value = ""; });
document.addEventListener("dragover", ev => { ev.preventDefault(); zone.classList.add("over"); });
document.addEventListener("dragleave", ev => { if (!ev.relatedTarget) zone.classList.remove("over"); });
document.addEventListener("drop", ev => { ev.preventDefault(); zone.classList.remove("over"); choose(ev.dataTransfer.files); });
document.addEventListener("paste", ev => {
  const images = [...ev.clipboardData.files].filter(f => f.type.startsWith("image/"));
  if (!images.length) return;
  ev.preventDefault();
  choose(images.map(f => new File([f], `pasted-image-${++pasted}.png`, { type: f.type })));
});
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "o") { ev.preventDefault(); input.click(); }
  else if (ev.key === "Enter" && document.activeElement === document.body) form.requestSubmit();
});
</script>
</body>
