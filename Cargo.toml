[package]
name = "barcode-read"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Read QR codes and barcodes from images and PDF pages"
repository = "https://github.com/nowmyagentcan/barcode-read"
publish = false

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
gif = "0.14"
# No bundled fonts or CMaps: codes are never drawn in the standard fonts or as CJK text.
hayro = { version = "0.8.0", default-features = false, features = ["simd"] }
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "webp", "pnm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiff = "0.11.3"
zune-jpeg = "0.5.15"
zxing-cpp = { version = "0.5.3", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
# Tests write JPEG inputs; the feature stays out of the shipped binary.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Tests decode and render full pages, which takes seconds without optimisation: our code gets
# a light pass, dependencies a full one. The C++ decoder also needs debug off, so that cmake-rs
# builds it as Release.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.zxing-cpp]
debug = false

# zxing-cpp is pinned to an upstream commit newer than any crates.io release: vendor/zxing-cpp is
# that commit as a submodule, vendor/zxing-cpp-rs its Rust wrapper (scripts/vendor-zxing.sh).
[patch.crates-io]
zxing-cpp = { path = "vendor/zxing-cpp-rs" }
